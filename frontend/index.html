<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>Cutout - Background remover </title>
        <link rel="stylesheet" href="/cc.css">
    </head>
    <body>
        <main class = "app">
            <header>
                <h1>cutout<span>.</span></h1>
                <p1>Clean Backgrounds no hassel</p1>
            </header>
            <section class="workspace">
              <label for ="imageInput" class="upload-box">
                <span class = "upload-icon">+</span>
                <h2> Drop your image here</h2>
                <p>or click to browse · PNG, JPG, webp </p>
                <input type ="file" id = "imageInput" accept="image/png,image/webp">
              </label>
              <div id ="previewArea" class="preview-area" hidden>
                <img id="previewImage" alt="Selected Image preview">
                <button id="removeButton">Remove Background</button>
                <button id="downloadButton" hidden>Download PNG</button>
                <p id="status" role="status"></p>

              </div>
              <div id="backgroundControls" hidden>
                <button class="color-btn" data-color="transparent">Transparent</button>
                <button class="color-btn" data-color="white">White</button>
                <button class="color-btn" data-color="black">Black</button>
            </div>
            </section>
             <footer>Private by design · Processing in your browser</footer>
        </main>
        <script type="module" src="br.js"></script>
    </body>
</html>
